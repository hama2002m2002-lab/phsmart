<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Glowing Accent Backdrop -->
  <circle cx="256" cy="240" r="140" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>

  <!-- Central POS Symbol & Register Graphic -->
  <rect x="116" y="140" width="280" height="200" rx="32" fill="url(#primaryGrad)"/>
  <rect x="136" y="160" width="240" height="110" rx="18" fill="#070D18" stroke="#38BDF8" stroke-width="4"/>

  <!-- Screen Text / 7amo.pos Logo Graphic -->
  <text x="256" y="235" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="2">7P</text>
  <text x="256" y="305" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="3">7AMO.POS</text>

  <!-- Cash Drawer Base -->
  <rect x="86" y="356" width="340" height="44" rx="14" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="4"/>
  <!-- Keyhole & Status LED -->
  <circle cx="256" cy="378" r="6" fill="#06B6D4"/>
  <circle cx="390" cy="378" r="5" fill="#10B981" filter="url(#glow)"/>
</svg>
