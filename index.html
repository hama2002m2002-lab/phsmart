  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="7amo.pos" />
    <meta name="description" content="نظام إدارة الماركيت والمبيعات والمخزون المتكامل مع النسخ الاحتياطي التلقائي ودعم العمل أوفلاين 100% بدون إنترنت" />
    <meta property="og:title" content="7amo.pos" />
    <meta property="og:description" content="نظام إدارة الماركيت والمبيعات والمخزون المتكامل مع النسخ الاحتياطي التلقائي ودعم العمل أوفلاين 100% بدون إنترنت" />
    <link rel="manifest" href="/manifest.json" />
    <title>7amo.pos</title>
    <script>
      // 1. Force unregister any legacy service workers immediately
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
      // 2. Clear any stale caches
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        }).catch(function() {});
      }
      // 3. Global error catcher for immediate visual diagnostics
      window.addEventListener('error', function(e) {
        console.error('[Global App Error]', e);
        var errBanner = document.getElementById('emergency-error-card');
        if (!errBanner && document.body) {
          errBanner = document.createElement('div');
          errBanner.id = 'emergency-error-card';
          errBanner.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;z-index:999999;background:#1e1b4b;border:2px solid #818cf8;border-radius:16px;padding:16px;color:#fff;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.8);font-family:system-ui,sans-serif;';
          errBanner.innerHTML = '<div style="font-weight:bold;margin-bottom:8px;">إعادة تنشيط البرنامج</div><div style="font-size:12px;color:#cbd5e1;margin-bottom:12px;">' + (e.message || 'حدث خطأ في تحميل الصفحة') + '</div><button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="background:#06b6d4;color:#000;border:none;padding:8px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">تحديث ومسح الذاكرة المؤقتة</button>';
          document.body.appendChild(errBanner);
        }
      });
    </script>
  </head>
  <body class="bg-[#0B1120] text-slate-100 antialiased select-none">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B1120; color: #38bdf8; font-family: system-ui, -apple-system, sans-serif;" dir="rtl">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="margin-top: 14px; font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 0.5px;">7amo.pos • جاري فتح النظام...</div>
        <div style="margin-top: 6px; font-size: 11px; color: #94a3b8;">يرجى الانتظار ثانية واحدة</div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
