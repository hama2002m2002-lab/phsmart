<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="7amo.pos" />
    <meta name="description" content="برنامج 7amo.pos لإدارة الماركيت والمبيعات والمخزون أوفلاين كـ تطبيق سطح مكتب" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>7amo.pos - Desktop & Offline POS System</title>
  </head>
  <body class="bg-[#0B1120] text-slate-100 antialiased select-none">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B1120;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center;padding:20px;">
        <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#06b6d4,#2563eb);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(6,182,212,0.4);margin-bottom:20px;">
          <span style="font-size:26px;font-weight:900;color:#ffffff;">7P</span>
        </div>
        <div style="font-size:18px;font-weight:bold;margin-bottom:8px;color:#ffffff;">7amo.pos</div>
        <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;">جاري تحميل النظام...</div>
        <div style="width:36px;height:36px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:posSpin 0.8s linear infinite;"></div>
      </div>
      <style>
        @keyframes posSpin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear any stale Service Workers in sandbox/preview to prevent black screen issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const reg of registrations) {
            reg.unregister().catch(() => {});
          }
        }).catch(() => {});
        if ('caches' in window) {
          caches.keys().then(keys => {
            for (const key of keys) {
              if (key.includes('7amo-pos')) {
                caches.delete(key).catch(() => {});
              }
            }
          }).catch(() => {});
        }
      }
    </script>
  </body>
</html>
