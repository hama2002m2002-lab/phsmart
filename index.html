<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="7amo.pos" />
    <meta name="description" content="برنامج 7amo.pos لإدارة الماركيت والمبيعات والمخزون أوفلاين كـ تطبيق سطح مكتب" />
    <link rel="manifest" href="/manifest.json" />
    <title>7amo.pos - Desktop & Offline POS System</title>
  </head>
  <body class="bg-[#0B1120] text-slate-100 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Immediate Service Worker registration with instant offline activation
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          if (typeof navigator !== 'undefined' && navigator.onLine) {
            reg.update().catch(function() {});
          }
        }).catch(function(err) {
          console.warn('[7amo.pos] Service Worker registration info:', err);
        });
      }
    </script>
  </body>
</html>
